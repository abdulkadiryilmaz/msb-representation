[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msb-representation"
version = "0.1.0"
description = "Multi-scale representation learning for market structure break semantics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "ccxt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.14.0",
    "umap-learn>=0.5.6",
    "numba>=0.59.0",
    "streamlit>=1.35.0",
]
notebook = [
    "ipykernel>=6.0.0",
    "nbformat>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
